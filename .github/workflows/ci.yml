name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install pnpm (same version as the lockfile was made with)
        run: npm install -g pnpm@10.34.7 && pnpm -v
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Analytics setup matches ADR-0026 (pinned tracker, script tag, CSP)
        run: pnpm --filter @workspace/digital-pantry run check:analytics
      - name: Build the website
        run: pnpm --filter @workspace/digital-pantry run build
        env:
          NODE_ENV: production
          PORT: "3000"
          BASE_PATH: /
      - name: Install Chromium for the egress test
        run: pnpm --filter @workspace/digital-pantry exec playwright install --with-deps chromium
      - name: Analytics egress test (no personal data leaves the page)
        run: pnpm --filter @workspace/digital-pantry run test:egress
      - name: Browser check (every page, phone and desktop, Night and Day, axe)
        run: pnpm --filter @workspace/digital-pantry run test:browser
      - name: Audit dependencies (high and critical)
        run: pnpm audit --audit-level high
        continue-on-error: true
